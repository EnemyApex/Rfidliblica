<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin RFID</title><link rel="stylesheet" href="style.css"></head>
<body>
<div id="lock"><div class="login-card"><h2>Admin</h2><input id="pin" type="password" placeholder="PIN admin123"><button onclick="if(pin.value==='admin123'){localStorage.setItem('admin','ok');location.reload()}">Entrer</button></div></div>
<div id="content" style="display:none">
<header><div class="logo">ADMIN</div><div><a href="/" class="live">USER</a> <a href="#" onclick="localStorage.clear();location.reload()" style="font-size:12px">Logout</a></div></header>
<div class="admin-form"><h3>Lier badge à utilisateur</h3><input id="emailLink" placeholder="Email utilisateur"><input id="uidLink" placeholder="UID badge (ex: 73A9B2C1)"><button onclick="linkUser()">Lier badge</button></div>
<div class="admin-form"><h3>Ajouter livre manuel</h3><input id="uidBook" placeholder="UID Livre"><input id="titleBook" placeholder="Titre"><input id="authorBook" placeholder="Auteur"><button onclick="addBook()">Ajouter livre</button></div>
<h3>Utilisateurs</h3><div id="users" class="grid"></div>
<h3 style="margin-top:20px">Livres + Emprunteur</h3><div id="books" class="grid"></div>
</div>
<script>
async function lierBadge(){
  const email = document.querySelector('input[placeholder="Email utilisateur"]').value;
  const uid = document.querySelector('input[placeholder="UID badge (ex: 73A9B2C1)"]').value;
  if(!email||!uid) return alert('Remplis tout');
  const res = await fetch('/api/link-badge', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({email, uid}) });
  const data = await res.json();
  if(res.ok){ alert('Badge lié!'); location.reload(); } else alert(data.error);
}

async function ajouterLivre(){
  const uid = document.querySelector('input[placeholder="UID Livre"]').value;
  const titre = document.querySelector('input[placeholder="Titre"]').value;
  const auteur = document.querySelector('input[placeholder="Auteur"]').value;
  if(!uid||!titre) return alert('UID + Titre obligatoire');
  const res = await fetch('/api/books', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({uid, title:titre, author:auteur}) });
  const data = await res.json();
  if(res.ok){ alert('Livre ajouté!'); location.reload(); } else alert(data.error);
}

document.querySelectorAll('button')[0].onclick = lierBadge;
document.querySelectorAll('button')[1].onclick = ajouterLivre;
</script></body></html>
