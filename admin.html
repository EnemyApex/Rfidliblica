<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin</title><link rel="stylesheet" href="style.css">
<style>
#content{padding:15px} .card{border:1px solid #ddd;padding:10px;margin:8px 0;border-radius:8px;display:flex;justify-content:space-between}
.admin-form{border:1px solid #000;padding:12px;margin:15px 0;border-radius:10px}
input{width:100%;padding:8px;margin:5px 0} button{padding:8px 15px;background:#000;color:#fff;border:none;border-radius:6px}
</style></head><body>
<div id="content">
<h2>ADMIN - plus de mot de passe</h2>
<a href="/">← Accueil</a>

<div class="admin-form">
<h3>1. Lier badge à un user</h3>
<input id="emailLink" placeholder="email de l'user (ex: toi@gmail.com)">
<input id="uidLink" placeholder="UID du badge (ex: A1B2C3)">
<button onclick="linkUser()">Lier</button>
</div>

<div class="admin-form">
<h3>2. Créer un livre</h3>
<input id="uidBook" placeholder="UID Livre scanné par ESP">
<input id="titleBook" placeholder="Titre">
<input id="authorBook" placeholder="Auteur">
<button onclick="addBook()">Ajouter livre</button>
</div>

<h3>Users</h3><div id="users">chargement...</div>
<h3>Livres</h3><div id="books">chargement...</div>
</div>

<script>
async function loadAll(){
 try{
  let u=await fetch('/api/auth').then(r=>r.json());
  users.innerHTML=u.map(x=>`<div class="card"><div><b>${x.name||''}</b><br>${x.email}<br>UID: ${x.uid||'❌ non lié'}</div></div>`).join('');
  let b=await fetch('/api/books').then(r=>r.json());
  books.innerHTML=b.map(book=>`<div class="card"><div><b>${book.title}</b> - ${book.author||''}<br>UID: ${book.uid}<br>${book.disponible===false?'🔴 emprunté par '+book.empruntePar:'🟢 dispo'}</div><button onclick="delBook('${book.uid}')">X</button></div>`).join('');
 }catch(e){ console.log(e); }
}
async function linkUser(){
 let email=emailLink.value.trim(), uid=uidLink.value.toUpperCase().trim();
 if(!email||!uid) return alert('remplis tout');
 let r=await fetch('/api/link-badge',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,uid})}).then(r=>r.json());
 alert(r.success?'Lié !':'Erreur: '+(r.error||'')); loadAll();
}
async function addBook(){
 let uid=uidBook.value.toUpperCase().trim(), title=titleBook.value.trim(), author=authorBook.value.trim();
 if(!uid||!title) return alert('UID + titre');
 let r=await fetch('/api/books',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({uid,title,author})}).then(r=>r.json());
 if(r.error) alert(r.error); else { alert('Livre ajouté'); uidBook.value=''; titleBook.value=''; loadAll(); }
}
async function delBook(uid){ if(!confirm('Supprimer '+uid+' ?')) return; await fetch('/api/books?uid='+uid,{method:'DELETE'}); loadAll(); }
loadAll();
setInterval(loadAll,4000);
</script>
</body></html>
