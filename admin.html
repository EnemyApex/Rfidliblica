<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin RFID</title>
<style>body{font-family:system-ui;background:#f6f6f6;margin:0}#login{position:fixed;inset:0;background:#000;color:#fff;display:flex;align-items:center;justify-content:center;z-index:9999}#loginBox{background:#222;padding:25px;border-radius:15px;width:90%;max-width:350px}#content{padding:15px;display:none}.card{border:1px solid #ddd;padding:12px;margin:10px 0;border-radius:10px;background:#fff}input{width:100%;padding:10px;margin:6px 0;border-radius:8px;border:1px solid #ccc;box-sizing:border-box}button{padding:12px;background:#000;color:#fff;border:none;border-radius:8px;width:100%} </style></head><body>
<div id="login"><div id="loginBox"><h2>🔒 Admin</h2><p>Mot de passe: overflowteam</p><input id="passInput" type="password" placeholder="overflowteam"><button onclick="doLogin()">Se connecter</button><div id="loginErr" style="color:#ff6b6b;margin-top:10px"></div></div></div>
<div id="content"><div style="display:flex;justify-content:space-between"><h2>Admin RFID</h2><button onclick="logout()" style="width:auto;background:#c00">Logout</button></div><a href="/">Accueil</a> | <a href="/borrow.html">Borrow</a>
<div class="card"><h3>1. Lier badge</h3><input id="email" placeholder="email"><input id="uidUser" placeholder="UID Badge A1B1B4"><button onclick="linkBadge()">Lier</button><div id="msgLink"></div></div>
<div class="card"><h3>2. Créer livre</h3><input id="title" placeholder="Titre"><input id="author" placeholder="Auteur"><input id="uidBook" placeholder="UID Livre DHDJ"><button onclick="addBook()">Ajouter</button><div id="msgBook"></div></div>
<h3>Users</h3><div id="users"></div><h3>Livres</h3><div id="books"></div></div>
<script>
let ADMIN_KEY=localStorage.getItem('rfid_admin_key')||'';
function getH(){return{'Content-Type':'application/json','x-admin-key':ADMIN_KEY};}
async function checkAuth(){const r=await fetch('/api/auth',{headers:getH()});return r.ok;}
async function doLogin(){ADMIN_KEY=document.getElementById('passInput').value.trim();if(await checkAuth()){localStorage.setItem('rfid_admin_key',ADMIN_KEY);location.reload();}else{loginErr.textContent='Mot de passe faux';}}
function logout(){localStorage.removeItem('rfid_admin_key');location.reload();}
async function loadAll(){const d=await fetch('/api/auth',{headers:getH()}).then(r=>r.json());users.innerHTML=(d.users||[]).map(u=>`<div class=card>${u.email} - UID: <b>${u.uid||'non lié'}</b></div>`).join('');books.innerHTML=(d.books||[]).map(b=>`<div class=card>${b.title} - ${b.uid} - ${b.disponible?'🟢':'🔴'}</div>`).join('');}
async function linkBadge(){const r=await fetch('/api/link-badge',{method:'POST',headers:getH(),body:JSON.stringify({email:email.value,uid:uidUser.value})}).then(r=>r.json());msgLink.textContent=r.success?'✅ Lié':'❌ '+r.error;if(r.success)loadAll();}
async function addBook(){const r=await fetch('/api/add-book',{method:'POST',headers:getH(),body:JSON.stringify({title:title.value,author:author.value,uid:uidBook.value})}).then(r=>r.json());msgBook.textContent=r.success?'✅ Ajouté':'❌ '+r.error;if(r.success)loadAll();}
(async()=>{if(ADMIN_KEY&&await checkAuth()){document.getElementById('login').style.display='none';document.getElementById('content').style.display='block';loadAll();}})();
</script></body></html>
