<title>Admin</title>

button{width:100%;padding:14px;background:#111;color:#fff;border-radius:12px;border:none;font-weight:bold}
.grid{display:grid;gap:12px;margin-top:16px}
.item{background:#fff;padding:12px;border-radius:12px;border:1px solid #eee;text-align:left}

<div id="lock" class="card">
<h1>Admin</h1>
<input id="pin" placeholder="PIN admin123" type="password">
<button onclick="doLogin()">Entrer</button>
</div>

<div id="content" style="display:none; width:95%; max-width:800px">

<input id="emailLink" placeholder="email utilisateur">
<input id="uidLink" placeholder="UID Badge">

<h2>Ajouter livre</h2>

<button onclick="addBook()">Ajouter</button>
<hr style="margin:24px 0">
<div id="list"></div>
<button onclick="logout()" style="margin-top:20px;background:#eee;color:#111">Logout</button>
</div>
</div>

<script>
const PIN = "admin123";
function doLogin(){
  if(document.getElementById('pin').value === PIN || new URLSearchParams(location.search).get('pin')===PIN){
    localStorage.setItem('admin','ok'); location.reload();
  } else alert('Mauvais PIN, tape admin123');
}
if(localStorage.getItem('admin')==='ok' || new URLSearchParams(location.search).get('pin')===PIN){
  document.getElementById('lock').style.display='none';
  document.getElementById('content').style.display='block';
  if(new URLSearchParams(location.search).get('pin')===PIN) localStorage.setItem('admin','ok');
  loadAll();
}
function logout(){ localStorage.removeItem('admin'); location.reload(); }
