<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>RFIDlib</title><link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700&family=Inter&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head>
<body>
<div id="login"><div class="login-card">
<h1 style="font-family:Fraunces">RFIDlib.</h1>
<input id="email" type="email" placeholder="Email">
<input id="pass" type="password" placeholder="Mot de passe">
<input id="name" placeholder="Prénom (pour inscription)">
<button onclick="doAuth('login')">Se connecter</button>
<button style="background:#eee;color:#111" onclick="doAuth('register')">Créer un compte</button>
<p id="msg" style="font-size:12px;color:red"></p>
<a href="/admin.html" style="font-size:12px;margin-top:10px">Admin</a>
</div></div>
<div id="app" style="display:none">
<header><div class="logo">RFIDlib.</div><div><small id="userName"></small> <a href="#" onclick="logout()" style="font-size:12px;margin-left:8px">Quitter</a></div></header>
<div class="stats"><div class="stat"><b id="total">0</b><span>Total</span></div><div class="stat"><b id="dispo">0</b><span>Dispo</span></div><div class="stat"><b id="empr">0</b><span>Mes emprunts</span></div></div>
<input id="search" placeholder="Rechercher livre..." oninput="filterBooks()">
<div id="books" class="grid"></div><div id="empty">En attente de badge...<br><small>Scanne ton badge puis un livre</small></div>
</div>
<script src="script.js"></script></body></html>
