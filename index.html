<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RFIDlib</title>
<style>
body{background:#fdfaf3;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;font-family:system-ui}
.box{background:#fff;padding:30px;border-radius:24px;width:90%;max-width:380px;box-shadow:0 10px 20px #0001}
h1{font-family:serif;text-align:center;font-size:42px}
input{width:100%;padding:14px;margin:8px 0;border-radius:12px;border:1px solid #ddd;box-sizing:border-box}
button{width:100%;padding:14px;border-radius:12px;border:none;font-weight:700;margin-top:8px}
.black{background:#000;color:#fff}
.gray{background:#eee}
</style>
</head>
<body>
<div class="box">
<h1>RFIDlib.</h1>
<input id="email" placeholder="Email">
<input id="pass" type="password" placeholder="Mot de passe">
<input id="name" placeholder="Prénom" style="display:none">
<button class="black" id="btn1" onclick="login()">Se connecter</button>
<button class="gray" id="btn2" onclick="toggle()">Créer un compte</button>
<p id="msg" style="color:red;text-align:center"></p>
</div>

<script>
let mode='login'
function toggle(){
 mode = mode=='login'?'register':'login'
 document.getElementById('name').style.display = mode=='register'?'block':'none'
 btn1.textContent = mode=='login'?'Se connecter':"S'inscrire"
 btn2.textContent = mode=='login'?'Créer un compte':'J ai déjà un compte'
}
async function login(){
 const email=document.getElementById('email').value
 const password=document.getElementById('pass').value
 const name=document.getElementById('name').value
 const url = mode=='login'?'/api/login-user':'/api/register'
 const body = mode=='login'?{email,password}:{email,password,name}
 const r = await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(r=>r.json())
 if(!r.success){msg.textContent=r.error;return}
 localStorage.setItem('email',email)
 location.href='/catalog.html'
}
</script>
</body>
</html>
