<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Borrow</title>
<style>body{font-family:system-ui;background:#f6f6f6;margin:0;padding:15px}.card{background:#fff;border:1px solid #ddd;padding:12px;margin:10px 0;border-radius:10px}input,button{width:100%;padding:12px;margin:6px 0;border-radius:8px;box-sizing:border-box}button{background:#000;color:#fff;border:none}#borrowArea{display:none}</style></head><body>
<h2>📚 Emprunt</h2><a href="/">Accueil</a>
<div id="loginArea" class="card"><h3>🔑 Badge</h3><input id="loginUid" placeholder="UID Badge A1B1B4"><button onclick="loginUser()">Se connecter</button><div id="loginMsg"></div></div>
<div id="borrowArea"><div id="userInfo" class="card" style="background:#e8f5e9"></div><div class="card"><input id="bookUid" placeholder="UID Livre DHDJ"><button onclick="doBorrow()">Emprunter / Retourner</button><button onclick="logoutUser()" style="background:#c00;margin-top:10px">Déconnexion</button><div id="result"></div></div><div id="log"></div></div>
<script>
let USER_TOKEN=localStorage.getItem('rfid_user_token')||'',USER_EMAIL=localStorage.getItem('rfid_user_email')||'';
function getH(){return{'Content-Type':'application/json','x-user-token':USER_TOKEN};}
async function loginUser(){const uid=loginUid.value.toUpperCase().trim();const r=await fetch('/api/login-user',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({uid})}).then(r=>r.json());if(!r.success){loginMsg.textContent='❌ '+r.error;return;}USER_TOKEN=r.token;USER_EMAIL=r.user.email;localStorage.setItem('rfid_user_token',USER_TOKEN);localStorage.setItem('rfid_user_email',USER_EMAIL);showBorrow();}
function showBorrow(){loginArea.style.display='none';borrowArea.style.display='block';userInfo.innerHTML=`Connecté: <b>${USER_EMAIL}</b><br>Badge: ${USER_TOKEN}`;loadLog();}
function logoutUser(){localStorage.clear();location.reload();}
async function doBorrow(){const bookUid=bookUidEl.value.toUpperCase().trim();const r=await fetch('/api/borrow',{method:'POST',headers:getH(),body:JSON.stringify({userUid:USER_TOKEN,bookUid})}).then(r=>r.json());result.innerHTML=r.success?`<div style=background:#dfd;padding:10px>✅ ${r.message}</div>`:`<div style=background:#fdd;padding:10px>❌ ${r.error}</div>`;if(r.success)loadLog();}
async function loadLog(){try{const logs=await fetch('/api/borrow',{headers:getH()}).then(r=>r.json());log.innerHTML=logs.slice(0,10).map(l=>`<div class=card>${l.bookTitle} - ${l.action} - ${new Date(l.date).toLocaleString()}</div>`).join('');}catch{}}
const bookUidEl=document.getElementById('bookUid');if(USER_TOKEN)showBorrow();
</script></body></html>
